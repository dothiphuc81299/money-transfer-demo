name: CI/CD Demo

on:
  push:
    branches: [new-test]
  pull_request:
    branches: [new-test]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      # 3️⃣ Install dependencies (jq)
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Setup QEMU (multi-platform build)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 6️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7️⃣ Build & Push Docker images
      - name: Build & Push Identity image
        uses: docker/build-push-action@v6
        with:
          context: ./cmd/identity
          file: ./cmd/identity/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/money-transfer-identity:latest

      - name: Build & Push Payment image
        uses: docker/build-push-action@v6
        with:
          context: ./cmd/payment
          file: ./cmd/payment/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/money-transfer-payment:latest

      # 8️⃣ Start containers for testing
      - name: Start services
        run: docker compose up -d --build

      # 9️⃣ Wait for Postgres
      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            docker exec money-transfer-postgres-db pg_isready -U postgres && break
            echo "⏳ Waiting for Postgres..."
            sleep 3
          done

      # 🔟 Test Identity API
      - name: Test Identity API
        run: |
          for i in {1..10}; do
            RESPONSE=$(curl -s -f http://localhost:5089/api/health || echo "")
            if [ -n "$RESPONSE" ]; then
              STATUS=$(echo "$RESPONSE" | jq -r .status)
              if [ "$STATUS" = "ok" ]; then
                echo "✅ Identity API healthy"
                break
              fi
            fi
            echo "⏳ Waiting for Identity API..."
            sleep 3
          done
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Identity API did not become healthy in time"
            exit 1
          fi

      # 1️⃣1️⃣ Test Payment API
      - name: Test Payment API
        run: |
          for i in {1..10}; do
            RESPONSE=$(curl -s -f http://localhost:5090/api/health || echo "")
            if [ -n "$RESPONSE" ]; then
              STATUS=$(echo "$RESPONSE" | jq -r .status)
              if [ "$STATUS" = "ok" ]; then
                echo "✅ Payment API healthy"
                break
              fi
            fi
            echo "⏳ Waiting for Payment API..."
            sleep 3
          done
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Payment API did not become healthy in time"
            exit 1
          fi

      # 1️⃣2️⃣ Tear down containers
      - name: Stop containers
        run: docker compose down
