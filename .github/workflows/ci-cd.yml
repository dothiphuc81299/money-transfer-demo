name: CI/CD Demo

on:
  push:
    branches: [new-test]
  pull_request:
    branches: [new-test]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      # 3️⃣ Install dependencies (jq)
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 4️⃣ Build Docker images (local, for testing)
      - name: Build Docker Images
        run: |
          docker build -f cmd/identity/Dockerfile -t identity-service .
          docker build -f cmd/payment/Dockerfile -t payment-service .

      # 5️⃣ Start containers with docker compose
      - name: Start services
        run: docker compose up -d --build

      # 6️⃣ Wait for Postgres
      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            docker exec money-transfer-postgres-db pg_isready -U postgres && break
            echo "⏳ Waiting for Postgres..."
            sleep 3
          done

      # 7️⃣ Test Identity API
      - name: Test Identity API
        run: |
          for i in {1..10}; do
            RESPONSE=$(curl -s -f http://localhost:5089/api/health || echo "")
            if [ -n "$RESPONSE" ]; then
              STATUS=$(echo "$RESPONSE" | jq -r .status)
              if [ "$STATUS" = "ok" ]; then
                echo "✅ Identity API healthy"
                break
              fi
            fi
            echo "⏳ Waiting for Identity API..."
            sleep 3
          done

          if [ "$STATUS" != "ok" ]; then
            echo "❌ Identity API did not become healthy in time"
            exit 1
          fi

      # 8️⃣ Test Payment API
      - name: Test Payment API
        run: |
          for i in {1..10}; do
            RESPONSE=$(curl -s -f http://localhost:5090/api/health || echo "")
            if [ -n "$RESPONSE" ]; then
              STATUS=$(echo "$RESPONSE" | jq -r .status)
              if [ "$STATUS" = "ok" ]; then
                echo "✅ Payment API healthy"
                break
              fi
            fi
            echo "⏳ Waiting for Payment API..."
            sleep 3
          done

          if [ "$STATUS" != "ok" ]; then
            echo "❌ Payment API did not become healthy in time"
            exit 1
          fi

      # 9️⃣ Tear down containers
      - name: Stop containers
        run: docker compose down

      # 🔟 Login to Docker Hub
      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1️⃣1️⃣ Build & push Identity image
      - name: Push Identity image
        if: success()
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/money-transfer-identity
          docker build -f cmd/identity/Dockerfile -t $IMAGE:latest .
          docker push $IMAGE:latest

      # 1️⃣2️⃣ Build & push Payment image
      - name: Push Payment image
        if: success()
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/money-transfer-payment
          docker build -f cmd/payment/Dockerfile -t $IMAGE:latest .
          docker push $IMAGE:latest